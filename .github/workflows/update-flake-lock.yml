name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Set date
        id: date
        run: echo "today=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - uses: DeterminateSystems/update-flake-lock@main
        id: update
        with:
          token: ${{ secrets.FLAKE_UPDATE_PAT }}
          # shizuku is a private repo over git+ssh; CI has no key for it,
          # so update only the public inputs explicitly.
          inputs: >-
            nixpkgs nixpkgs-darwin darwin home-manager home-manager-darwin
            nixos-wsl disko sops-nix nur-tnmt hyprdynamicmonitors
            nix-claude-code nix-steipete-tools zen-browser bun2nix
          commit-msg: "flake.lock: Update ${{ steps.date.outputs.today }}"
          pr-title: "flake.lock: Update ${{ steps.date.outputs.today }}"
      # Merges once ci.yml's required status checks pass on the PR;
      # see main branch protection settings.
      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_PAT }}
        run: >-
          gh pr merge --auto --squash
          --subject "flake.lock: Update ${{ steps.date.outputs.today }}"
          "${{ steps.update.outputs.pull-request-number }}"
