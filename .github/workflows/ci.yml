name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"

# Cancel superseded PR runs. On main, let in-progress runs finish so that
# long uncached builds (e.g. sheprd) complete and reach cachix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code || (echo "::error::Files are not formatted. Run 'nix fmt' locally." && exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .
      - name: statix
        run: nix run nixpkgs#statix -- check .
      - name: shellcheck
        run: nix build .#checks.x86_64-linux.shell --no-link

  # The pre-commit hook runs `gitleaks protect --staged`, but that is
  # bypassable with --no-verify; scan the full history here as a backstop.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
      - name: gitleaks
        run: nix run nixpkgs#gitleaks -- detect --source . --no-banner

  build-nixos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [sunflower, dahlia]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tnmt
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          # Free plan is capped at 5GB. Skip fetched sources and bun2nix's
          # per-package tarballs (download-only, no build cost) to leave
          # room for actually expensive builds (e.g. tokyonight-gtk-theme).
          pushFilter: "(-source$)|(\\.tgz$)|(\\.tar\\.gz$)"
      - name: Build NixOS (${{ matrix.host }})
        run: |
          nix build '.#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel' \
            --no-link \
            --no-write-lock-file

  # hydrangea cannot be *built* without a macOS runner, but evaluating
  # the full darwin system catches option/module errors on a Linux runner.
  eval-darwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
      - name: Evaluate darwin (hydrangea)
        run: |
          nix eval '.#darwinConfigurations.hydrangea.config.system.build.toplevel.drvPath' \
            --no-write-lock-file

  # NOTE: work_mac / work_vm have moved to tnmt-work-flake (private repo)
  # and are validated there.
