keys:
  - &tnmt age124qtmtc34yg8jsre09m6lyf35u4heemwd0jm6609j94ygnrn4p4q7vkg5x
  - &dahlia age1x83l95gqyu5r5d5wjlkfm44q0ggj2tr79njuhgqlqdvlqdgcwvpqmsxgnl
  - &sunflower age1avnkg4hjnprjsn2f8ehj8nzgzutj930tdx67f9t66gf85k24c3mq0n89jf
  - &hydrangea age1c3w7yxyym205xxuz0slfuh405vn9u69zr5tumenlggcrdjvupaksz424j6
  # Server that publishes the name-masked Obsidian vault; reads only mask-dict.
  - &obsidian_masker age1cqxdk6ulzk6c87nqlz8ss9rsv5e0dwe3x6dljedagxkcvstt99mq8e90m4

creation_rules:
  - path_regex: secrets/hosts/dahlia\.yaml$
    key_groups:
      - age:
          - *tnmt
          - *dahlia
  - path_regex: secrets/hosts/sunflower\.yaml$
    key_groups:
      - age:
          - *tnmt
          - *sunflower
  - path_regex: secrets/hosts/hydrangea\.yaml$
    key_groups:
      - age:
          - *tnmt
          - *hydrangea
  - path_regex: secrets/(roles|common).*\.yaml$
    key_groups:
      - age:
          - *tnmt
          - *dahlia
          - *sunflower
          - *hydrangea
  - path_regex: secrets/apps/tnmt-info/mask-dict\.yaml$
    key_groups:
      - age:
          - *tnmt
          - *dahlia
          - *sunflower
          - *hydrangea
          - *obsidian_masker
  - path_regex: secrets/apps/.*$
    key_groups:
      - age:
          - *tnmt
          - *dahlia
          - *sunflower
          - *hydrangea
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *tnmt
